# TEST-ONLY config (WP5.2b phase-2 investigation, mock hardware + arm_app backend:=real).
# NOT a production config and NOT a replacement for configs/pick_place/live_ros2.yaml.
#
# Purpose: run the real-backend semantics (MoveIt IK + 100 Hz servo bridging) with
# mock hardware, i.e. the WP5.2b chain, without the real arm.
# Geometry mirrors configs/pick_place/profiles/real_pick.yaml (legacy test config).
# F-013: the object placeholder is no longer an arm_app parameter / static TF; it is
# provided by the standalone publisher
# `python3 ~/discover/tools/object_pose_publisher.py --config ~/discover/tools/configs/object_pose_real.yaml`
# (dynamic TF, 30 Hz default; rule_base only reads `frames.object`). Kept for
# historical reference only; grasp TCP (0.38, 0, 0.065),
# pregrasp (0.38, 0, 0.115), post_grasp (0.35, 0, 0.17), all IK-feasible with
# joint-limit margin >= 0.54 rad).
# Mock-hardware grasp contact is simulated on the server side and is NOT config:
# `mock_grasp_contact_angle_rad:=0.7767` (0.0445 m contact width) must be passed to
# arm_stack.launch.py for hardware_type:=mock runs (default 0 = off for real hardware).
task: pick
fixture_only: true
frames:
  root: world
  arm_base: base_link
  object: objects_cube_01
profile:
  calibration_revision: so101-real-mockhw-wp5.2b-v1
  field_validated: false
  cube_side_m: 0.05
  cube_axes_in_object_xyzw: [0, 0, 0, 1]
  tcp_to_gripper_rotation_xyzw: [0, 0, 0, 1]
  grasp_contact_offset_tcp_m: [0.04, 0.0, 0.0]
  reference_tcp_orientation_root_xyzw: [0, 0.7071067811865476, 0, 0.7071067811865476]
  pregrasp_clearance_m: 0.05
  gripper_open_m: 0.08
  gripper_closed_m: 0.03
  grasp_min_width_m: 0.034
  grasp_max_width_m: 0.055
  workspace_min_m: [0.0, -0.3, 0.0]
  workspace_max_m: [0.6, 0.3, 0.6]
  post_grasp_position_arm_m: [0.35, 0.0, 0.17]
  post_grasp_orientation_arm_xyzw: [0, 0.7071067811865476, 0, 0.7071067811865476]
  hold_duration_s: 0.2
limits:
  servo_hz: 20
  servo_max_gap_s: 0.3
  stable_time_s: 0.2
  motion_stable_time_s: 0.2
  motion_joint_velocity_rad_s: 0.02
  linear_speed_m_s: 0.05
  linear_step_m: 0.01
  position_tolerance_m: 0.01
  orientation_tolerance_rad: 0.1
  stage_timeout_s: 15
  warmup_timeout_s: 15
  tf_age_s: 1.0
  tf_skew_s: 0.2
  tf_future_tolerance_s: 0.05
  max_grasp_attempts: 1
  grasp_confirmation_timeout_s: 2.0
  recovery_feedback_timeout_s: 5.0
  recovery_feedback_stable_time_s: 0.3
  max_cube_tilt_rad: 0.2617993877991494
  gripper_hold_hz: 5
  gripper_effort: 8
arm:
  acquire_control: true
  manage_lease: true
  rpc_timeout_ms: 5000
  cleanup_rpc_timeout_ms: 2000
  feedback_timeout_s: 0.5
  state_timeout_s: 2.0
ros2:
  prefix: /arm
  base_frame: base_link
  tcp_frame: gripper_frame_link
